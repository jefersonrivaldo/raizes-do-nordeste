spring.application.name=raizes-do-nordeste
server.port=${PORT:8000}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/raizes;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000}
spring.datasource.username=sa
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.accept-case-insensitive-enums=false
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/openapi.json
server.error.include-message=never
server.error.include-stacktrace=never
app.jwt-secret=${JWT_SECRET:}
app.token-ttl=${TOKEN_TTL_SECONDS:3600}
app.seed-password=${SEED_ADMIN_PASSWORD:}
app.seed-enabled=${SEED_ENABLED:true}
spring.jackson.deserialization.accept-float-as-int=false
app.order-reservation-ttl-seconds=${ORDER_RESERVATION_TTL_SECONDS:1800}
app.order-expiration-scan-ms=${ORDER_EXPIRATION_SCAN_MS:60000}
app.auth-rate-limit-max-requests=${AUTH_RATE_LIMIT_MAX_REQUESTS:20}
app.auth-rate-limit-window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
